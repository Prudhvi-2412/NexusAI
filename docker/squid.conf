# Private loopback-only forward proxy used by browser automation and remote MCP.
http_port 127.0.0.1:3128
visible_hostname nexusai-egress
cache_effective_user nexusai
cache_effective_group nexusai
pid_filename /tmp/squid.pid
coredump_dir /tmp

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443
# Squid normalizes IPv4-mapped IPv6 destinations to IPv4 for these ACL checks.
acl blocked_destination dst \
    0.0.0.0/8 \
    10.0.0.0/8 \
    100.64.0.0/10 \
    127.0.0.0/8 \
    169.254.0.0/16 \
    172.16.0.0/12 \
    192.0.0.0/24 \
    192.0.2.0/24 \
    192.88.99.0/24 \
    192.168.0.0/16 \
    198.18.0.0/15 \
    198.51.100.0/24 \
    203.0.113.0/24 \
    224.0.0.0/4 \
    240.0.0.0/4 \
    ::/128 \
    ::1/128 \
    64:ff9b:1::/48 \
    100::/64 \
    2001::/23 \
    2001:db8::/32 \
    2002::/16 \
    fc00::/7 \
    fe80::/10 \
    ff00::/8
acl blocked_destination_name dstdomain .localhost .local .internal .test .invalid .localdomain metadata.goog metadata.azure.com

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_destination
http_access deny blocked_destination_name
http_access allow all

cache deny all
cache_mem 8 MB
maximum_object_size 0 KB
access_log stdio:/dev/stdout
cache_log /tmp/squid-cache.log
cache_store_log none
